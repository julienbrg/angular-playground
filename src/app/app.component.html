<a href="#main-content" class="skip-link">Skip to main content</a>
<header class="header">
  <a routerLink="/" class="brand">Angular Playground</a>
  <nav class="menu">
    <button
      type="button"
      class="burger"
      aria-label="Menu"
      aria-controls="main-menu"
      [attr.aria-expanded]="menuOpen"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
    @if (menuOpen) {
      <ul id="main-menu" class="menu-content">
        <li><a routerLink="/new" routerLinkActive="active" (click)="closeMenu()">New</a></li>
      </ul>
    }
  </nav>
</header>
<main id="main-content" class="main">
  <router-outlet></router-outlet>
</main>
